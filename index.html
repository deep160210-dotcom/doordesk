<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172b25"><meta name="description" content="Private door shop order and design management">
<link rel="manifest" href="manifest.webmanifest">
<title>DoorDesk — Shop Management</title>
<style>
:root{--ink:#172b25;--muted:#6c7771;--line:#e4e9e5;--paper:#f6f8f6;--white:#fff;--accent:#b98751;--green:#285a45;--red:#a74438;--shadow:0 10px 28px #18372a12}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:11px}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.gold{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--red)}.tab.active{background:#e9efe9;border-color:#cbd8ce}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11px;color:var(--muted);font-weight:700}.hero{background:var(--ink);color:#fff;padding:26px;border-radius:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero p{color:#d5ded8;max-width:590px}.hero h2{font-size:28px;line-height:1.15;margin:8px 0}.metric{font-size:28px;font-weight:750}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}.sectionhead h2{font-size:18px;margin:0}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:75px;resize:vertical}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:99px;background:#edf2ee;color:#355342;font-size:12px}.doorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.door{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.door .visual{height:125px;background:linear-gradient(135deg,#e8e4dc,#c9bda9);display:grid;place-items:center;font-size:50px}.door .body{padding:12px}.door h3{font-size:14px;margin:0 0 5px}.door p{font-size:12px;color:var(--muted);margin:0 0 8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.status{font-size:11px;border-radius:99px;padding:5px 8px;background:#edf2ee;white-space:nowrap}.status.New{background:#fff1dc;color:#80551e}.status.Delivered{background:#e4f4e9;color:#24623d}.status.Cancelled{background:#fbe9e7;color:#9b3930}.hide{display:none!important}.notice{padding:12px 14px;background:#fff8e9;border:1px solid #f0dfb9;border-radius:12px;color:#755522;font-size:13px}.success{background:#eaf5ed;border-color:#cfe5d4;color:#285a45}.login{max-width:460px;margin:7vh auto}.footer{margin:28px 0 8px;text-align:center;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.tiny{font-size:12px}.customer-only{background:#fff}.topline{height:4px;background:linear-gradient(90deg,var(--accent),#e4c79f)}@media(max-width:760px){.shell{padding:14px}.span8,.span6,.span4,.span3{grid-column:span 12}.hero{display:block}.hero h2{font-size:24px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.row{flex-direction:column;gap:0}}
</style>
</head>
<body><div class="topline"></div><main class="shell">
<header class="top"><div class="brand"><div class="logo">⌂</div><div><h1>DoorDesk</h1><small>Door orders · designs · customers</small></div></div><div class="nav" id="topNav"></div></header>
<div id="app"></div>
<footer class="footer">DoorDesk · Private shop workspace · Keep customer information secure</footer>
</main>
<script type="module" src="app.js"></script>
</body></html>
